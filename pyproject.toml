[project]
name = "cheq-churn-mcp"
version = "0.1.0"
description = "Trustworthy local churn analytics MCP server"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "duckdb>=1.4.4",
    "datasets>=5.0.1",
    "fastmcp>=3.1.0",
    "pandas>=3.0.5",
    "pydantic>=2.12.5",
]

[project.scripts]
cheq-churn-mcp = "cheq_churn_mcp.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.14.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
